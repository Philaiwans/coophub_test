<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยืนยันอีเมลของคุณ</title>
</head>
<body>
    <h2>สวัสดี {{ user.username }} 👋</h2>
    <p>ขอบคุณที่สมัครใช้บริการ <strong>CoopHub</strong></p>
    <p>กรุณาคลิกลิงก์ด้านล่างเพื่อยืนยันอีเมลของคุณ:</p>
    <p>
        <a href="http://{{ domain }}{% url 'activate' uidb64=uid token=token %}">
            คลิกที่นี่เพื่อยืนยันบัญชีของคุณ
        </a>
    </p>
    <p>หากคุณไม่ได้ทำรายการนี้ กรุณาละเว้นอีเมลนี้</p>
</body>
</html>
