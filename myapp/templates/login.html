<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ | CoopHub</title>
  <style>
    body {
      background-color: #f6f7fb;
      font-family: "Prompt", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.15);
      text-align: center;
    }
    h2 { font-family: "Comic Sans MS"; }
    input {
      width: 100%; padding: 10px; margin: 10px 0;
      border-radius: 8px; border: 1px solid #ddd;
    }
    button {
      background: #007bff; color: white; border: none;
      padding: 10px; border-radius: 8px; width: 100%;
    }
    .bottom { margin-top: 10px; display: flex; justify-content: space-between; font-size: 14px; }
    a { color: #007bff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>CoopHub</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
    <div class="bottom">
      <a href="{% url 'password_reset' %}">ลืมรหัสผ่าน</a>
      <a href="{% url 'register' %}">สมัครสมาชิก</a>
    </div>
    {% for msg in messages %}<p style="color:red;">{{ msg }}</p>{% endfor %}
  </div>
</body>
</html>
