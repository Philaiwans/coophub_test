<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตั้งรหัสผ่านใหม่</title>

    <style>
        body {
            margin:0;
            font-family:"Prompt", sans-serif;
            background:#f5f5f5;
        }

        .navbar {
            background:#2f80ed;
            padding:15px 25px;
            color:#fff;

            /* ฟอนต์ CoopHub แบบในภาพ */
            font-family:"Comic Sans MS", "Comic Sans", cursive;
            font-size:30px;
            font-weight:bold;
            letter-spacing:-1.5px;
        }

        .card {
            max-width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
        }

        input {
            width:100%;
            padding:10px;
            margin:10px 0;
            border-radius:8px;
            border:1px solid #ddd;
            box-sizing:border-box;
        }

        button {
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#2f80ed;
            color:white;
        }
    </style>
</head>

<body>

<div class="navbar">CoopHub</div>

<div class="card">

    {% if validlink %}

        <h2>ตั้งรหัสผ่านใหม่</h2>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            {{ form.new_password1.errors }}

            <input
                type="password"
                name="new_password1"
                placeholder="รหัสผ่านใหม่"
            >

            {{ form.new_password2.errors }}

            <input
                type="password"
                name="new_password2"
                placeholder="ยืนยันรหัสผ่านใหม่"
            >

            <button type="submit">
                บันทึกรหัสผ่าน
            </button>

        </form>

    {% else %}

        <p>ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว</p>

    {% endif %}

</div>

</body>
</html>
