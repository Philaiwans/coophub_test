<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopHub - Student Home</title>

    <!-- โหลดไอคอน Flaticon -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <style>
        body {
            margin: 0;
            font-family: "Prompt", Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Navbar */
        .navbar {
            background-color: #2f80ed;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-title {
            font-size: 28px;
            font-weight: bold;
            font-family: "Comic Sans MS", cursive;
            cursor: pointer;
        }

        .navbar-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar-icons img,
        .profile-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .profile-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: white;
            border: 2px solid #2f80ed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2f80ed;
            cursor: pointer;
            font-size: 20px;
        }

        /* Dropdown */
        .profile-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            position: absolute;
            top: 50px;
            right: 0;
            width: 170px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ccc;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.15);
            display: none;
            z-index: 100;
        }

        .dropdown-menu a {
            display: block;
            padding: 12px;
            font-size: 14px;
            text-decoration: none;
            color: black;
            border-bottom: 1px solid #e5e5e5;
        }

        .dropdown-menu a:last-child {
            border-bottom: none;
        }

        .dropdown-menu a:hover {
            background-color: #f2f2f2;
        }

        /* Content */
        .content {
            padding: 30px;
            text-align: center;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">

        <!-- Logo -->
        <div class="navbar-title" onclick="window.location.href='{% url 'student_home' %}'">
            CoopHub
        </div>

        <!-- Icons -->
        <div class="navbar-icons">

            <!-- ระฆังแจ้งเตือน -->
            <img src="https://img.icons8.com/ios-filled/50/ffffff/appointment-reminders.png" 
                 title="การแจ้งเตือน">

            <!-- ปุ่มเขียนโพสต์ (สำคัญมาก) -->
            <a href="{% url 'create_post' %}">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/edit.png"
                     title="สร้างโพสต์ใหม่">
            </a>

            <!-- ถังขยะ (ยังไม่ใช้) -->
            <img src="https://img.icons8.com/ios-filled/50/ffffff/delete.png" 
                 title="ลบ">

            <!-- Dropdown โปรไฟล์ -->
            <div class="profile-container">

                {% if user_obj.profile_image %}
                    <img class="profile-img" src="{{ user_obj.profile_image.url }}" id="profileBtn">
                {% else %}
                    <div class="profile-icon" id="profileBtn">
                        <i class="fi fi-rr-user"></i>
                    </div>
                {% endif %}

                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="#">Community</a>
                    <a href="#">Major Chat</a>
                    <a href="{% url 'profile' %}">My Profile</a>
                    <a href="#">แดชบอร์ด</a>
                    <a href="#">บันทึกกิจกรรม</a>
                    <a href="{% url 'logout' %}">ออกจากระบบ</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <p>ยินดีต้อนรับ, <b>{{ user_obj.first_name }} {{ user_obj.last_name }}</b></p>
        <p>เลือกเมนูด้านบนเพื่อเริ่มต้นใช้งานระบบ</p>
    </div>

    <!-- Script Dropdown -->
    <script>
        const profileBtn = document.getElementById("profileBtn");
        const dropdownMenu = document.getElementById("dropdownMenu");

        profileBtn.onclick = () => {
            dropdownMenu.style.display =
                dropdownMenu.style.display === "block" ? "none" : "block";
        };

        document.addEventListener("click", function(event) {
            if (!profileBtn.contains(event.target) &&
                !dropdownMenu.contains(event.target)) {
                dropdownMenu.style.display = "none";
            }
        });
    </script>

</body>
</html>
