<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แก้ไขโปรไฟล์</title>

    <style>
        body {
            margin: 0;
            font-family: 'Prompt', sans-serif;
            background-color: #f5f5f5;
        }

        /* Navbar */
        .navbar {
            background-color: #2f80ed;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .profile-upload {
            text-align: center;
            margin-bottom: 25px;
        }

        .circle-upload {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid #2f80ed;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #888;
            font-size: 15px;
            flex-direction: column;
            background-color: #f9f9f9;
        }

        .btn-save {
            width: 150px;
            background-color: #2f80ed;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
</head>

<body>

<div class="navbar" onclick="window.location.href='{% url 'student_home' %}'">
    CoopHub
</div>

<div class="container">
    <h2>ข้อมูลส่วนตัว</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Upload Profile -->
        <div class="profile-upload">
            <label for="profileInput">
                <div class="circle-upload">
                    📷 <br> อัพโหลดรูปโปรไฟล์ <br>
                    <small>ไฟล์ .jpg .png</small>
                </div>
            </label>
            <input id="profileInput" type="file" name="profile_image" style="display: none;">
        </div>

        <label>Username</label>
        <input type="text" name="username" value="{{ user.username }}">

        <label>ชื่อ</label>
        <input type="text" name="first_name" value="{{ user.first_name }}">

        <label>นามสกุล</label>
        <input type="text" name="last_name" value="{{ user.last_name }}">

        <label>คณะ</label>
        <input type="text" name="faculty" value="{{ user.faculty }}">

        <label>สาขา</label>
        <input type="text" name="major" value="{{ user.major }}">

        <label>รหัสนักศึกษา</label>
        <input type="text" name="student_id" value="{{ user.student_id }}">

        <label>อีเมล</label>
        <input type="email" name="email" value="{{ user.email }}">

        <button class="btn-save" type="submit">บันทึก</button>
    </form>
</div>

</body>
</html>
