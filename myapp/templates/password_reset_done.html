<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตรวจสอบอีเมล</title>

    <style>
        body {
            margin:0;
            font-family:"Prompt", sans-serif;
            background:#f5f5f5;
        }

        .navbar {
            background:#2f80ed;
            padding:15px 25px;
            color:#fff;

            /* ฟอนต์ CoopHub แบบในภาพ */
            font-family:"Comic Sans MS", "Comic Sans", cursive;
            font-size:30px;
            font-weight:bold;
            letter-spacing:-1.5px;
        }

        .card {
            max-width:500px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

<div class="navbar">CoopHub</div>

<div class="card">
    <h2>ตรวจสอบอีเมล</h2>

    <p>
        คุณสามารถตั้งรหัสผ่านใหม่โดยคลิกลิงก์ในอีเมลที่เราส่งไป
    </p>

    <p>
        หากคุณไม่พบอีเมลดังกล่าว ลองมองหาดูในที่อื่น ๆ
        เช่น อีเมลขยะ สแปม หรือกล่องอื่น ๆ
    </p>
</div>

</body>
</html>
