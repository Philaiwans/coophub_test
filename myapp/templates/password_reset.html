<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตั้งรหัสผ่านใหม่</title>
    <style>
        body {
            margin: 0;
            font-family: "Prompt", sans-serif;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #2f80ed;
            padding: 15px 25px;
            color: white;
            font-size: 26px;
            font-weight: bold;
        }
        .card {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #2f80ed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="navbar">CoopHub</div>

<div class="card">
    <h2>ตั้งรหัสผ่านใหม่</h2>
    <p>กรอกอีเมลของคุณ<span style="color:red">*</span></p>

    <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <input type="email" name="email" placeholder="อีเมล" required>
        <button type="submit">ดำเนินการต่อ</button>
    </form>
</div>
</body>
</html>
