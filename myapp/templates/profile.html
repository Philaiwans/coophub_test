<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>โปรไฟล์ของฉัน</title>
    <style>
        body {
            margin: 0;
            font-family: 'Prompt', sans-serif;
            background-color: #f5f5f5;
        }

        /* Navbar */
        .navbar {
            background-color: #2f80ed;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #2f80ed;
            display: block;
            margin: 0 auto;
            object-fit: cover;
            background-color: #ddd;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .info {
            margin-top: 25px;
        }

        .info p {
            font-size: 18px;
            margin: 10px 0;
        }

        .edit-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #2f80ed;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar" onclick="window.location.href='{% url 'student_home' %}'">
    CoopHub
</div>

<div class="container">
    <h2>โปรไฟล์ของฉัน</h2>

    <img class="profile-pic"
     src="{% if user.profile_image %}{{ user.profile_image.url }}{% else %}https://i.imgur.com/Z0ZGuTX.png{% endif %}">

    <div class="info">
        <p><strong>ชื่อจริง:</strong> {{ user.first_name }}</p>
        <p><strong>นามสกุล:</strong> {{ user.last_name }}</p>
        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>คณะ:</strong> {{ user.faculty }}</p>
        <p><strong>สาขา:</strong> {{ user.major }}</p>
        <p><strong>รหัสนักศึกษา:</strong> {{ user.student_id }}</p>

        <a href="{% url 'edit_profile' %}" class="edit-btn">แก้ไขข้อมูล</a>
    </div>
</div>

</body>
</html>
